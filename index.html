<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boundful - Issue Tracker</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="app-container">
  <!-- Top Navigation Header -->
  <header class="jira-header">
    <div class="header-left">
      <span class="jira-logo"><i class="fa-solid fa-cube"></i> Boundful</span>
      <span class="nav-item active">Projects</span>
      <span class="nav-item">Filters</span>
      <span class="nav-item">Dashboards</span>
      <button class="create-btn">Create</button>
    </div>
    <div class="header-right">
      <input type="text" placeholder="Search Boundful..." class="global-search">
      <div class="user-avatar" title="Logged in as BoundedDev">BD</div>
    </div>
  </header>

  <div class="main-body">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="project-info">
        <img src="icon.svg" alt="Project Icon" class="project-icon" width="24" height="24">
        <div>
          <h3>Boundful Issues</h3>
          <span class="project-type">Software project</span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="active"><i class="fa-solid fa-list"></i> Issue navigator</a>
        <a href="#"><i class="fa-solid fa-chart-pie"></i> Reports</a>
        <a href="#"><i class="fa-solid fa-box-archive"></i> Components</a>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="content-area">
      <h1>Search requests</h1>
      <div class="filter-bar">
        <input type="text" id="issue-search-input" placeholder="Type to filter..." class="filter-input">
        <select class="filter-select"><option>Status: All Open</option></select>
        <select class="filter-select"><option>Priority: All</option></select>
      </div>

      <div class="table-container">
        <table class="issue-table">
          <thead>
          <tr>
            <th>T</th>
            <th>Key</th>
            <th>Summary</th>
            <th>Status</th>
            <th>Priority</th>
            <th>Updated</th>
          </tr>
          </thead>
          <tbody id="issue-table-body">
          <!-- Populated dynamically by js/modules/filters.js -->
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<script src="js/app.js" type="module"></script>
</body>
</html>
